//
// The snapshot: everything a player could possibly see in the WoW 3.3.5a client, and
// nothing more. Single source of truth for the module <-> harness protocol; the
// prose and rationale are in snapshot.md, coverage in coverage-ui.md and
// coverage-opcodes.md. Recordings and eval examples use the canonical protobuf JSON
// mapping (examples/*.json); the wire between module and harness is binary.
//
// Conventions:
// - Composition instead of inheritance: a Unit carries optional `player`, `group`,
//   `boss`, `pet`, `vehicle` parts; an Item an optional `equipment` part; a Spell
//   optional `ability` / `trainer` parts.
// - Money is copper (uint32; the gold cap fits). Durations: `_s` (float seconds) or
//   `_ms` (uint32). Distances in yards (`_yd`).
// - Every field is glance-level (always sent while its message is present) unless
//   it says otherwise with the `visibility` option: HOVER fields are only filled
//   inside `Base.tooltips`; OPEN fields belong to panels the bot has opened.
// - Fields backed by an addon carry the `addon` option; they are only filled when
//   the bot has that addon in its loadout (snapshot.md §6).

edition = "2024";

package wlb.snapshot;

// As in Chromium: generated C++ uses the lite runtime. The wire is binary; JSON exists only
// in tooling (harness recordings, evals), converted via a descriptor-based TypeResolver.
option optimize_for = LITE_RUNTIME;
// proto3 semantics: scalars have no presence; absent means default (false, 0, "").
option features.field_presence = IMPLICIT;

// Option-only import (Edition 2024): the annotations are readable through descriptors, but
// the generated (lite) code does not depend on snapshot_options.proto or descriptor.proto.
import option "snapshot_options.proto";

// ---------------------------------------------------------------------------------
// Shared value types.

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Screen-relative compass direction from the bot.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  HERE = 1;
  N = 2;
  NE = 3;
  E = 4;
  SE = 5;
  S = 6;
  SW = 7;
  W = 8;
  NW = 9;
}

// Where something is relative to the bot, as a player judges it on screen.
message Relative {
  enum Height {
    HEIGHT_UNSPECIFIED = 0;
    LEVEL = 1;
    ABOVE = 2;
    BELOW = 3;
  }
  float dist_yd = 1;
  Direction dir = 2;
  Height height = 3;
  bool in_los = 4;
  Vec3 position = 5;
  // The bot is behind it (backstab, shred).
  bool behind_it = 6;
  bool facing_me = 7;
}

message LevelRange {
  uint32 min = 1;
  uint32 max = 2;
}

// The client's tooltip text, in order (one string per line).
message Tooltip {
  repeated string lines = 1;
}

enum DispelType {
  DISPEL_TYPE_UNSPECIFIED = 0;
  DISPEL_NONE = 1;
  MAGIC = 2;
  CURSE = 3;
  POISON = 4;
  DISEASE = 5;
}

enum RaidMarker {
  RAID_MARKER_UNSPECIFIED = 0;
  STAR = 1;
  CIRCLE = 2;
  DIAMOND = 3;
  TRIANGLE = 4;
  MOON = 5;
  SQUARE = 6;
  CROSS = 7;
  SKULL = 8;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  TANK = 1;
  HEALER = 2;
  DPS = 3;
}

// A cost in something other than gold: emblems, honor, arena points, or items such as
// Stone Keeper's Shards (vendors show these instead of / besides a gold price).
message CurrencyAmount {
  string name = 1;
  uint32 count = 2;
}

// Fixed stat vocabulary, shared by item tooltips and the character sheet.
enum Stat {
  STAT_UNSPECIFIED = 0;
  STRENGTH = 1;
  AGILITY = 2;
  STAMINA = 3;
  INTELLECT = 4;
  SPIRIT = 5;
  ARMOR = 6;
  HEALTH = 7;
  MANA = 8;
  ATTACK_POWER = 9;
  RANGED_ATTACK_POWER = 10;
  SPELL_POWER = 11;
  MP5 = 12;
  HIT_RATING = 13;
  CRIT_RATING = 14;
  HASTE_RATING = 15;
  EXPERTISE_RATING = 16;
  ARMOR_PENETRATION_RATING = 17;
  SPELL_PENETRATION = 18;
  DEFENSE_RATING = 19;
  DODGE_RATING = 20;
  PARRY_RATING = 21;
  BLOCK_RATING = 22;
  BLOCK_VALUE = 23;
  RESILIENCE_RATING = 24;
  FIRE_RESISTANCE = 25;
  FROST_RESISTANCE = 26;
  NATURE_RESISTANCE = 27;
  SHADOW_RESISTANCE = 28;
  ARCANE_RESISTANCE = 29;
  WEAPON_DPS = 30;
  WEAPON_MIN_DAMAGE = 31;
  WEAPON_MAX_DAMAGE = 32;
  WEAPON_SPEED = 33;
  // Character sheet only (derived values, percent or points).
  MELEE_CRIT_PCT = 40;
  RANGED_CRIT_PCT = 41;
  SPELL_CRIT_PCT = 42;
  MELEE_HIT_PCT = 43;
  SPELL_HIT_PCT = 44;
  HASTE_PCT = 45;
  EXPERTISE = 46;
  DEFENSE = 47;
  DODGE_PCT = 48;
  PARRY_PCT = 49;
  BLOCK_PCT = 50;
}

message StatValue {
  Stat stat = 1;
  float value = 2;
}

// ---------------------------------------------------------------------------------
// Spells, auras, casts.

message Spell {
  enum School {
    SCHOOL_UNSPECIFIED = 0;
    PHYSICAL = 1;
    HOLY = 2;
    FIRE = 3;
    NATURE = 4;
    FROST = 5;
    SHADOW = 6;
    ARCANE = 7;
  }
  message Cost {
    // "mana", "rage", "energy", "runic_power", "focus", "health", "runes".
    string power = 1;
    uint32 amount = 2;
    // Percent-of-base costs (most mana spells).
    float pct = 3;
  }
  uint32 id = 1;
  string name = 2;
  uint32 rank = 3;
  float cooldown_s = 4;

  School school = 5 [(visibility) = HOVER];
  Cost cost = 6 [(visibility) = HOVER];
  uint32 cast_time_ms = 7 [(visibility) = HOVER];
  float range_yd = 8 [(visibility) = HOVER];
  Tooltip tooltip = 9 [(visibility) = HOVER];

  // On an action bar / in the spellbook.
  AbilityState ability = 10;
  // At a trainer.
  TrainerSpell trainer = 11;
}

message AbilityState {
  float cooldown_remaining_s = 1;
  // Not greyed out (resource, form, reactive conditions met).
  bool usable = 2;
  // Range indicator against the current target.
  bool in_range = 3;
  bool known = 4;
  uint32 charges = 5;
  // Action bar slot, e.g. "1", "bar2:5", "pet:3".
  string slot = 6;
  // Item buttons (potions, quest items) show how many are left.
  uint32 item_count = 7;
  bool autocast = 8;
  // Casting it shows a targeting circle (Blizzard, Death and Decay, Hurl Boulder).
  bool ground_targeted = 9;
}

message TrainerSpell {
  uint32 price = 1;
  uint32 required_level = 2;
  // Green in the trainer list.
  bool learnable = 3;
  // Learned already (grey) / needs another rank or skill (red).
  bool learned = 4;
  string requires = 5;
}

message Cast {
  Spell spell = 1;
  uint32 remaining_ms = 2;
  // The cast bar has no shield.
  bool interruptible = 3;
  string target = 4;
  bool channeled = 5;
}

message Aura {
  uint32 id = 1;
  string name = 2;
  bool harmful = 3;
  float remaining_s = 4;
  uint32 stacks = 5;
  // The debuff border colour.
  DispelType dispel_type = 6;
  bool dispellable_by_me = 7;
  string caster = 8;
  Tooltip tooltip = 9 [(visibility) = HOVER];
}

message Activity {
  enum State {
    STATE_UNSPECIFIED = 0;
    IDLE = 1;
    MOVING = 2;
    PATROLLING = 3;
    APPROACHING_ME = 4;
    FLEEING = 5;
    FIGHTING = 6;
    CASTING = 7;
    CHANNELING = 8;
    TALKING = 9;
    EMOTING = 10;
    LOOTING = 11;
    GATHERING = 12;
    SITTING = 13;
    FOLLOWING = 14;
    FISHING = 15;
    DEAD = 16;
    DRINKING = 17;
    STEALTHED = 18;
    AFK = 19;
  }
  State state = 1;
  Cast cast = 2;
  // Who it is fighting / following / talking to.
  string with = 3;
  // Speech bubble or emote text.
  string text = 4;
}

// ---------------------------------------------------------------------------------
// Units.

message Unit {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    NPC = 1;
    PLAYER = 2;
    PET = 3;
    VEHICLE = 4;
    TOTEM = 5;
    CRITTER = 6;
  }
  enum LevelColor {
    LEVEL_COLOR_UNSPECIFIED = 0;
    GRAY = 1;
    GREEN = 2;
    YELLOW = 3;
    ORANGE = 4;
    RED = 5;
    // "??": far above the bot.
    SKULL_LEVEL = 6;
  }
  enum Reaction {
    REACTION_UNSPECIFIED = 0;
    HOSTILE = 1;
    NEUTRAL = 2;
    FRIENDLY = 3;
  }
  enum Classification {
    CLASSIFICATION_UNSPECIFIED = 0;
    NORMAL = 1;
    ELITE = 2;
    RARE = 3;
    RARE_ELITE = 4;
    WORLD_BOSS = 5;
  }
  enum ThreatStatus {
    THREAT_STATUS_UNSPECIFIED = 0;
    THREAT_NONE = 1;
    // Yellow / orange indicator: about to pull aggro.
    THREAT_HIGH = 2;
    // Red: it is attacking me.
    THREAT_AGGRO = 3;
  }
  enum QuestMarker {
    QUEST_MARKER_UNSPECIFIED = 0;
    // Yellow "!".
    QUEST_AVAILABLE = 1;
    // Gray "!": below or above my level.
    QUEST_AVAILABLE_LOW = 2;
    // Yellow "?".
    QUEST_TURN_IN = 3;
    // Gray "?": quest in progress.
    QUEST_INCOMPLETE = 4;
    // Blue "!" / "?".
    QUEST_DAILY = 5;
  }
  enum Service {
    SERVICE_UNSPECIFIED = 0;
    VENDOR = 1;
    CLASS_TRAINER = 2;
    PROFESSION_TRAINER = 3;
    REPAIR = 4;
    INNKEEPER = 5;
    FLIGHT_MASTER = 6;
    BANKER = 7;
    AUCTIONEER = 8;
    STABLE_MASTER = 9;
    SPIRIT_HEALER = 10;
    BATTLEMASTER = 11;
    GUILD_MASTER = 12;
    TABARD_VENDOR = 13;
    QUEST_GIVER = 14;
    GUILD_BANKER = 15;
    BARBER = 16;
    ARENA_ORGANIZER = 17;
    WEAPON_MASTER = 18;
  }
  enum VisualState {
    VISUAL_STATE_UNSPECIFIED = 0;
    POLYMORPHED = 1;
    STUNNED = 2;
    FEARED = 3;
    SAPPED = 4;
    ASLEEP = 5;
    BANISHED = 6;
    FROZEN = 7;
    ICE_BLOCK = 8;
    BUBBLED = 9;
    MIND_CONTROLLED = 10;
    STEALTH_SHIMMER = 11;
    SHACKLED = 12;
    ROOTED = 13;
    DRUNK_SWAY = 14;
  }
  // Mobs standing together: pull one, get the pack.
  message Pack {
    uint32 id = 1;
    uint32 size = 2;
  }

  string guid = 1;
  string name = 2;
  Relative rel = 3;
  Kind kind = 4;
  uint32 level = 5;
  LevelColor level_color = 6;
  Reaction reaction = 7;
  Classification classification = 8;
  float health_pct = 9;
  float power_pct = 10;
  bool dead = 11;
  // Sparkles on the corpse.
  bool lootable = 12;
  bool skinnable = 13;
  // Grey name plate: someone else tagged it.
  bool tapped_by_other = 14;
  bool targeting_me = 15;
  string target = 16;
  ThreatStatus threat_status = 17;
  QuestMarker quest_marker = 18;
  bool pvp_flagged = 19;
  Activity activity = 20;
  repeated Aura auras = 21;
  RaidMarker raid_marker = 22;
  Pack pack = 23;
  repeated VisualState visual_state = 24;
  // The Questie icon over it ("Kill 8 Mottled Boars").
  string quest_relevant = 25 [(addon) = "Questie"];
  // Guild / race / services lines of the unit tooltip.
  repeated Service services = 26 [(visibility) = HOVER];
  // Short NPC subtitle under the name, e.g. "<Weapon Merchant>".
  string subtitle = 27;

  // Exactly one of these may be set, by kind.
  PlayerPart player = 30;
  GroupPart group = 31;
  BossPart boss = 32;
  PetPart pet = 33;
  VehiclePart vehicle = 34;
}

message PlayerPart {
  string class = 1;
  string race = 2 [(visibility) = HOVER];
  string guild = 3 [(visibility) = HOVER];
  string title = 4;
  bool in_my_group = 5;
  bool is_friend = 6;
  bool is_ignored = 7;
  bool afk = 8;
  bool dnd = 9;
  uint32 gearscore = 10 [(visibility) = HOVER, (addon) = "GearScore"];
}

// A party / raid member (the unit also has `player`).
message GroupPart {
  // Only while the client shows a role icon (Dungeon Finder groups, role check). Otherwise
  // unset: players infer roles from class, spec and gear.
  Role role = 1;
  bool online = 2;
  uint32 health_deficit = 3;
  bool in_range = 4;
  bool aggro = 5;
  uint32 subgroup = 6;
  bool leader = 7;
  bool assistant = 8;
  bool main_tank = 9;
  // Ready check answer while one is running.
  string ready = 10;
}

message BossPart {
  uint32 phase = 1 [(addon) = "DBM"];
}

message PetPart {
  enum Happiness {
    HAPPINESS_UNSPECIFIED = 0;
    UNHAPPY = 1;
    CONTENT = 2;
    HAPPY = 3;
  }
  Happiness happiness = 1;
  repeated Spell abilities = 2;
  // "aggressive", "defensive", "passive".
  string stance = 3;
  string owner = 4;
  // "Wolf", "Spirit Beast" (unit frame / stable / tooltip).
  string family = 5;
}

message VehiclePart {
  message Seat {
    uint32 index = 1;
    string occupant = 2;
    bool can_use = 3;
  }
  // Siege weapons and turrets: the aim arc on screen.
  message Aim {
    float pitch_deg = 1;
    float min_pitch_deg = 2;
    float max_pitch_deg = 3;
    // Where a shot lands at the current pitch and facing.
    Relative impact = 4;
  }
  repeated Seat seats = 1;
  repeated Spell abilities = 2;
  Aim aim = 3;
}

// ---------------------------------------------------------------------------------
// The bot itself.

message Self {
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    MALE = 1;
    FEMALE = 2;
  }
  enum PowerType {
    POWER_TYPE_UNSPECIFIED = 0;
    MANA = 1;
    RAGE = 2;
    ENERGY = 3;
    RUNIC_POWER = 4;
    FOCUS = 5;
  }
  enum LifeState {
    LIFE_STATE_UNSPECIFIED = 0;
    ALIVE = 1;
    DEAD_BODY = 2;
    GHOST = 3;
  }
  enum Drunk {
    DRUNK_UNSPECIFIED = 0;
    SOBER = 1;
    TIPSY = 2;
    DRUNK = 3;
    SMASHED = 4;
  }
  // Loss-of-control effects on the bot.
  message Control {
    bool stunned = 1;
    bool feared = 2;
    bool charmed = 3;
    bool silenced = 4;
    bool rooted = 5;
    bool pacified = 6;
    bool disarmed = 7;
  }
  // Main-screen cues a player notices without opening anything.
  message Indicators {
    message Durability {
      enum Level {
        LEVEL_UNSPECIFIED = 0;
        DAMAGED = 1;
        BROKEN = 2;
      }
      string slot = 1;
      Level level = 2;
    }
    // Talent button flashing.
    bool talent_points_unspent = 1;
    // The armour figure.
    repeated Durability durability_warning = 2;
    bool calendar_invite_pending = 3;
    bool new_mail = 4;
    uint32 bag_free_slots = 5;
    // Battleground / arena queue eye on the minimap.
    bool in_queue = 6;
    // Unread achievement toast / new title etc. on the micro buttons.
    bool achievement_toast = 7;
  }
  message AutoAttack {
    bool melee = 1;
    bool ranged = 2;
  }
  // Rogue poisons, weapon oils, shaman imbues on the weapon (buff bar).
  message WeaponEnchant {
    string slot = 1;
    string name = 2;
    float remaining_s = 3;
    uint32 charges = 4;
  }
  message Rune {
    // "blood", "frost", "unholy", "death".
    string type = 1;
    float ready_in_s = 2;
  }

  // Unit frame fields (name, level, health_pct, auras, ...) plus `player`.
  Unit unit = 1;
  Gender gender = 2;
  uint32 xp = 3;
  uint32 xp_next = 4;
  uint32 rested_xp = 5;
  uint32 health = 6;
  uint32 health_max = 7;
  PowerType power_type = 8;
  uint32 power = 9;
  uint32 power_max = 10;
  // Druids in bear / cat form still see their mana (AlternatePowerBar).
  uint32 alt_mana = 11;
  uint32 alt_mana_max = 12;
  LifeState state = 13;
  bool in_combat = 14;
  bool resting = 15;
  bool camping = 16;
  bool mounted = 17;
  bool swimming = 18;
  bool in_flight = 19;
  bool on_transport = 20;
  Control control = 21;
  Cast casting = 22;
  uint32 money = 23;
  Indicators indicators = 24;
  uint32 gcd_remaining_ms = 25;
  AutoAttack auto_attack = 26;
  bool in_cinematic = 27;
  Drunk drunk = 28;
  repeated WeaponEnchant weapon_enchants = 29;
  // Death knights (RuneFrame, always on screen).
  repeated Rune runes = 30;
  // Stance / form / stealth / presence / aura currently active.
  string form = 31;
  bool pvp_flagged = 32;
  bool group_leader = 33;
}

// ---------------------------------------------------------------------------------
// The world: objects, ground effects, places.

message GameObject {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    QUEST_OBJECT = 1;
    HERB = 2;
    ORE = 3;
    CHEST = 4;
    MAILBOX = 5;
    DOOR = 6;
    CAMPFIRE = 7;
    BOBBER = 8;
    MEETING_STONE = 9;
    SUMMONING_PORTAL = 10;
    TRANSPORT = 11;
    FISHING_POOL = 12;
    BARBER_CHAIR = 13;
    GUILD_VAULT = 14;
    PORTAL = 15;
    RITUAL = 16;
    OTHER = 17;
    // Workshops, towers (world PvP, Wintergrasp).
    CAPTURE_POINT = 18;
    // Walls, gates, towers that take damage.
    DESTRUCTIBLE = 19;
  }
  string guid = 1;
  string name = 2;
  Relative rel = 3;
  Kind kind = 4;
  bool usable = 5;
  // "open", "closed", "active", "used".
  string state = 6;
  // Quest sparkle.
  bool highlighted = 7;
  // Herb / ore / lock skill needed, red if too high.
  uint32 required_skill = 8;
  // DESTRUCTIBLE: damage state is in `state` ("intact", "damaged", "destroyed").
  float health_pct = 9;
  // CAPTURE_POINT: controlling faction and the capture bar (0 = Alliance, 100 = Horde).
  string owner = 10;
  float capture_progress_pct = 11;
}

// A ground effect (fire, consecration, void zone).
message Area {
  string guid = 1;
  string name = 2;
  Relative rel = 3;
  Spell spell = 4;
  float radius_yd = 5;
  bool inside_me = 6;
  bool hostile = 7;
  float remaining_s = 8;
}

message Place {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TOWN = 1;
    CAMP = 2;
    FLIGHT_MASTER = 3;
    INNKEEPER = 4;
    GRAVEYARD = 5;
    DUNGEON = 6;
    RAID = 7;
    ZONE_EXIT = 8;
    LANDMARK = 9;
    CAMPFIRE = 10;
    AUCTION_HOUSE = 11;
    BANK = 12;
    TRAINER = 13;
    VENDOR = 14;
    DOCK = 15;
    ZEPPELIN_TOWER = 16;
    ZONE = 17;
    OBJECTIVE_AREA = 18;
    BATTLEMASTER = 19;
    GUILD_BANK = 20;
    BARBER_SHOP = 21;
    STABLE = 22;
  }
  string name = 1;
  Relative rel = 2;
  Kind kind = 3;
  // Discovered / flight path known.
  bool known = 4;
  LevelRange level_range = 5 [(visibility) = HOVER];
  // Quest this objective area / pin belongs to.
  string quest = 6;
}

// ---------------------------------------------------------------------------------
// Items.

message Item {
  enum Quality {
    QUALITY_UNSPECIFIED = 0;
    POOR = 1;
    COMMON = 2;
    UNCOMMON = 3;
    RARE_QUALITY = 4;
    EPIC = 5;
    LEGENDARY = 6;
    ARTIFACT = 7;
    HEIRLOOM = 8;
  }
  enum Kind {
    KIND_UNSPECIFIED = 0;
    EQUIPMENT = 1;
    CONSUMABLE = 2;
    QUEST = 3;
    TRADE_GOOD = 4;
    RECIPE = 5;
    CONTAINER = 6;
    REAGENT = 7;
    PROJECTILE = 8;
    JUNK = 9;
    KEY = 10;
    GEM = 11;
    GLYPH = 12;
    CURRENCY_TOKEN = 13;
    OTHER = 14;
  }
  enum Binding {
    BINDING_UNSPECIFIED = 0;
    NOT_BOUND = 1;
    SOULBOUND = 2;
    BIND_ON_PICKUP = 3;
    BIND_ON_EQUIP = 4;
    BIND_ON_USE = 5;
    BIND_TO_ACCOUNT = 6;
  }
  uint32 id = 1;
  string name = 2;
  Quality quality = 3;
  uint32 count = 4;
  Kind kind = 5;
  // "bag0:3", "bank:12", "gbank:1:40", "keyring:2".
  string bag_slot = 6;
  bool usable = 7;
  float cooldown_s = 8;
  uint32 charges = 9;
  // Quest-starting item ("This Item Begins a Quest").
  bool starts_quest = 10;
  // Price where one is shown: merchant, buyback, auction, mail COD.
  uint32 price = 11;
  // Auction: buyout and current bid; time-left bucket.
  uint32 buyout = 12;
  string seller = 13;
  string time_left = 14;
  // Emblem / honor / arena / token vendors (with or without a gold `price`).
  repeated CurrencyAmount currency_price = 15;

  uint32 item_level = 20 [(visibility) = HOVER];
  uint32 required_level = 21 [(visibility) = HOVER];
  Binding binding = 22 [(visibility) = HOVER];
  bool unique = 23 [(visibility) = HOVER];
  uint32 vendor_value = 24 [(visibility) = HOVER];
  Tooltip tooltip = 25 [(visibility) = HOVER];

  // Wearable items.
  EquipmentPart equipment = 30;
}

message EquipmentPart {
  enum Slot {
    SLOT_UNSPECIFIED = 0;
    HEAD = 1;
    NECK = 2;
    SHOULDER = 3;
    BACK = 4;
    CHEST = 5;
    SHIRT = 6;
    TABARD = 7;
    WRIST = 8;
    HANDS = 9;
    WAIST = 10;
    LEGS = 11;
    FEET = 12;
    FINGER1 = 13;
    FINGER2 = 14;
    TRINKET1 = 15;
    TRINKET2 = 16;
    MAIN_HAND = 17;
    OFF_HAND = 18;
    RANGED = 19;
    BAG = 20;
  }
  message Socket {
    // "red", "yellow", "blue", "meta", "prismatic".
    string color = 1;
    Item gem = 2;
  }
  Slot slot = 1;
  float durability_pct = 2;
  repeated StatValue stats = 3 [(visibility) = HOVER];
  repeated Socket sockets = 4 [(visibility) = HOVER];
  string socket_bonus = 5 [(visibility) = HOVER];
  string enchant = 6 [(visibility) = HOVER];
  // Armour type / weapon type, e.g. "Mail", "Two-Hand Axe"; red when I can't use it.
  string type = 7 [(visibility) = HOVER];
  uint32 gearscore = 8 [(visibility) = HOVER, (addon) = "GearScore"];
  int32 gearscore_delta = 9 [(visibility) = HOVER, (addon) = "GearScore"];
  bool upgrade = 10 [(visibility) = HOVER, (addon) = "GearScore"];
}

// ---------------------------------------------------------------------------------
// Objectives: quests and the bot's own goals.

message Objective {
  message Progress {
    uint32 have = 1;
    uint32 need = 2;
  }
  string title = 1;
  Progress progress = 2;
  bool done = 3;
  Place where = 4;

  oneof source {
    QuestPart quest = 10;
    GoalPart goal = 11;
    AchievementPart achievement = 12;
  }
}

message QuestPart {
  uint32 quest_id = 1;
  string quest = 2;
  string text = 3;
  bool complete = 4;
  bool failed = 5;
  bool daily = 6;
  float timer_s = 7;
  string escort = 8;
  // "group", "dungeon", "raid", "heroic", "pvp".
  string tag = 9;
  uint32 level = 10;
  // The quest item button in the tracker.
  Spell item_button = 11;
}

message GoalPart {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    SELL = 1;
    BUY = 2;
    TRAIN = 3;
    REPAIR = 4;
    LEARN_PROFESSION = 5;
    REACH_LEVEL = 6;
    TRAVEL_TO = 7;
    MEET = 8;
    FARM = 9;
    OTHER = 10;
  }
  string id = 1;
  Kind goal_kind = 2;
  map<string, string> params = 3;
}

// A tracked achievement (WatchFrame).
message AchievementPart {
  uint32 achievement_id = 1;
}

message Achievement {
  message Criterion {
    string name = 1;
    bool done = 2;
    uint32 have = 3;
    uint32 need = 4;
  }
  uint32 id = 1;
  string name = 2;
  string description = 3;
  uint32 points = 4;
  string category = 5;
  bool earned = 6;
  // Date earned, e.g. "2026-11-15".
  string earned_on = 7;
  repeated Criterion criteria = 8;
  // Reward text ("Title: Explorer").
  string reward = 9;
}

// ---------------------------------------------------------------------------------
// Base view (always present).

message Where {
  string map = 1;
  string zone = 2;
  string subzone = 3;
  Vec3 position = 4;
  // Radians, 0 = north.
  float facing = 5;
  bool indoors = 6;
  bool in_instance = 7;
  // Sanctuary / contested / friendly / hostile (zone text colour).
  string pvp_status = 8;
}

// What the bot is doing, from its own point of view.
message Doing {
  string activity = 1;
  float since_s = 2;
  string detail = 3;
}

message Nearby {
  // Up to 50, by salience.
  repeated Unit units = 1;
  // Up to 20.
  repeated GameObject objects = 2;
  // Up to 20.
  repeated Area areas = 3;
}

enum Panel {
  PANEL_UNSPECIFIED = 0;
  MAP = 1;
  BAGS = 2;
  CHARACTER = 3;
  QUEST_LOG = 4;
  SPELLBOOK = 5;
  TALENTS = 6;
  SKILLS = 7;
  REPUTATION = 8;
  SOCIAL = 9;
  CALENDAR = 10;
  ACHIEVEMENTS = 11;
  CURRENCY = 12;
  PVP = 13;
  COMPANIONS = 14;
  DUNGEON_FINDER = 15;
  // Battleground / arena score window.
  SCOREBOARD = 16;
}

// What the bot points at.
message HoverRef {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    ITEM = 1;
    SPELL = 2;
    AURA = 3;
    UNIT = 4;
    ZONE = 5;
    PLACE = 6;
    QUEST = 7;
    ACHIEVEMENT = 8;
    OBJECT = 9;
  }
  Kind kind = 1;
  // Numeric id, guid or bag slot, as a string.
  string id = 2;
  string name = 3;
}

message Ui {
  repeated Panel open_panels = 1;
  repeated HoverRef hovering = 2;
}

// One hovered thing: its tooltip lines and the full typed object.
message Tooltipped {
  HoverRef ref = 1;
  Tooltip tooltip = 2;
  oneof object {
    Item item = 3;
    Spell spell = 4;
    Aura aura = 5;
    Unit unit = 6;
    Place place = 7;
    Achievement achievement = 8;
    GameObject game_object = 9;
  }
  string questie = 10 [(addon) = "Questie"];
  // "Currently Equipped": the item(s) in the slot(s) a hovered item would replace.
  repeated Item compare = 11;
}

message Base {
  Self self = 1;
  Where where = 2;
  Doing doing = 3;
  Nearby nearby = 4;
  Ui ui = 5;
  repeated Tooltipped tooltips = 6 [(visibility) = HOVER];
}

// ---------------------------------------------------------------------------------
// Glance extensions (always on screen).

message Minimap {
  string zone = 1;
  string subzone = 2;
  // "14:32" (server or local, as the clock is set).
  string clock = 3;
  repeated Place places = 4;
  repeated Place objective_areas = 5;
  // Find Herbs / Track Beasts blips.
  repeated Unit tracked = 6;
  repeated GameObject tracked_objects = 7;
  repeated Unit party = 8;
  Relative corpse = 9;
  // Tracking type enabled ("Find Herbs").
  string tracking = 10;
}

message ActionBars {
  repeated Spell buttons = 1;
  // Stance / form / stealth / presence bar (BonusActionBarFrame).
  repeated Spell stance_bar = 2;
  // Shaman totem-call bar (MultiCastActionBarFrame).
  repeated Spell totem_bar = 3;
}

message WorldState {
  // "Wintergrasp: battle in", "Portals opened", "Time to save Stratholme".
  string label = 1;
  string value = 2;
  float timer_s = 3;
}

message World {
  message Queue {
    // Battleground / arena / Wintergrasp.
    string name = 1;
    // "queued", "ready", "in_progress".
    string status = 2;
    float waited_s = 3;
    float estimated_s = 4;
  }
  uint32 session_minutes = 1;
  uint32 daily_reset_in_s = 2;
  repeated string server_messages = 3;
  // WorldStateFrame anywhere (outside battlegrounds too).
  repeated WorldState world_states = 4;
  repeated Queue queues = 5;
  // Active world events (calendar holidays shown in the client): "Hallow's End".
  repeated string holidays = 6;
}

// ---------------------------------------------------------------------------------
// Situational frames (on screen while the situation lasts).

message Target {
  Unit target = 1;
  Unit focus = 2;
  string target_of_target = 3;
  // Native 3.3 threat percentage on the target frame.
  float my_threat_pct = 4;
}

message Combat {
  message Threat {
    string unit = 1;
    float my_threat_pct = 2;
    string top = 3;
  }
  message Resources {
    uint32 combo_points = 1;
    uint32 soul_shards = 2;
    uint32 ammo = 3;
  }
  repeated Unit attackers = 1;
  repeated Threat threat = 2 [(addon) = "Omen"];
  Resources resources = 3;
  // Recent floating combat text / combat log, summarized.
  string summary = 4;
  string duel_opponent = 5;
}

message Party {
  string leader = 1;
  repeated Unit members = 2;
  repeated string missing_buffs_i_can_give = 3;
  string loot_method = 4;
  string loot_threshold = 5;
  // Instance difficulty set by the leader.
  string difficulty = 6;
  // Formed by the Dungeon Finder (role icons shown, teleport in/out from the eye).
  bool lfg = 7;
}

message Raid {
  repeated Unit members = 1 [(addon) = "Grid"];
  repeated string main_tanks = 2;
}

message Encounter {
  message Timer {
    string name = 1;
    float remaining_s = 2;
  }
  Unit boss = 1;
  repeated Timer dbm = 2 [(addon) = "DBM"];
}

message Instance {
  message Boss {
    string name = 1;
    bool killed = 2;
  }
  string name = 1;
  string difficulty = 2;
  uint32 size = 3;
  repeated Boss bosses = 4;
  string locked_until = 5;
  Place entrance = 6;
}

message Death {
  Relative corpse = 1;
  float can_resurrect_in_s = 2;
  Place spirit_healer = 3;
  string resurrect_offer_from = 4;
  // Soulstone / Reincarnation button.
  string self_resurrect = 5;
}

// The open NPC / object window. Only one at a time, as in the client.
message Interaction {
  message Merchant {
    repeated Item items = 1;
    repeated Item buyback = 2;
    bool can_repair = 3;
    uint32 repair_cost = 4;
    // The vendor window shows how many of its currencies I own.
    repeated CurrencyAmount my_currency = 5;
  }
  message QuestDialog {
    string title = 1;
    string text = 2;
    string objectives = 3;
    repeated Item rewards = 4;
    repeated Item choices = 5;
    uint32 money = 6;
    uint32 xp = 7;
    // "offer", "progress", "complete".
    string stage = 8;
  }
  message Gossip {
    message Option {
      string text = 1;
      // The icon in front of the line: "chat", "vendor", "trainer", "taxi", "binder",
      // "banker", "tabard", "battlemaster", "money".
      string icon = 2;
      // Some lines cost money (confirmed by a popup), e.g. dual spec, talent reset.
      uint32 cost = 3;
      // The line opens a text box (enter a code).
      bool needs_text = 4;
    }
    string text = 1;
    repeated Option options = 2;
    repeated string quests = 3;
  }
  message FlightMap {
    message Destination {
      Place place = 1;
      // The cost shown on hover over the node (the client shows it on the map).
      uint32 price = 2;
      // Known but not connected from here (greyed).
      bool unreachable = 3;
    }
    repeated Destination destinations = 1;
  }
  message Mail {
    string from = 1;
    string subject = 2;
    string body = 3;
    uint32 money = 4;
    uint32 cod = 5;
    repeated Item items = 6;
    float expires_in_days = 7;
    // Inbox icon: "player", "auction", "system", "returned".
    string kind = 8;
    // Opened envelope.
    bool read = 9;
  }
  message AuctionHouse {
    repeated Item my_auctions = 1;
    repeated Item my_bids = 2;
    repeated Item results = 3;
    string query = 4;
  }
  message Recipe {
    message Reagent {
      Item item = 1;
      uint32 have = 2;
      uint32 need = 3;
    }
    string name = 1;
    repeated Reagent reagents = 2;
    // "orange", "yellow", "green", "gray".
    string skillup_color = 3;
    uint32 can_craft = 4;
    float cooldown_s = 5;
  }
  message Tradeskill {
    string profession = 1;
    uint32 skill = 2;
    uint32 max = 3;
    repeated Recipe recipes = 4;
  }
  message Inspect {
    Unit player = 1;
    repeated Item equipped = 2;
    repeated uint32 points_per_tree = 3;
    uint32 honorable_kills = 4;
    repeated string arena_teams = 5;
    uint32 achievement_points = 6;
  }
  message RaidBrowserEntry {
    string leader = 1;
    string raid = 2;
    string comment = 3;
    uint32 members = 4;
  }
  message RaidBrowser {
    repeated RaidBrowserEntry entries = 1;
  }
  message Bank {
    repeated Item items = 1;
    uint32 bag_slots_purchased = 2;
    uint32 next_slot_cost = 3;
  }
  message GuildBank {
    message Tab {
      string name = 1;
      repeated Item items = 2;
      uint32 withdrawals_left = 3;
      bool can_view = 4;
      bool can_deposit = 5;
    }
    repeated Tab tabs = 1;
    uint32 money = 2;
    uint32 withdraw_money_left = 3;
    repeated string log = 4;
  }
  // The socketing window shows sockets and the bonus without hovering (unlike the
  // item's own `equipment.sockets`, which are tooltip-only).
  message Socketing {
    Item item = 1;
    repeated Item gems_in_bags = 2;
    repeated EquipmentPart.Socket sockets = 3;
    string socket_bonus = 4;
    // Bonus active with the gems placed so far.
    bool bonus_active = 5;
    // Placed in the window but not yet applied ("Apply" button).
    repeated Item pending = 6;
  }
  message Barber {
    uint32 cost = 1;
    repeated string options = 2;
  }
  message Stable {
    repeated Unit stabled = 1;
    uint32 slots = 2;
    uint32 next_slot_cost = 3;
  }
  message Petition {
    // "guild" or "arena_2v2" etc.
    string kind = 1;
    string name = 2;
    repeated string signatures = 3;
    uint32 needed = 4;
  }
  message Registrar {
    uint32 charter_cost = 1;
  }
  message Trainer {
    repeated Spell spells = 1;
  }
  message ItemText {
    string title = 1;
    // The current page.
    string text = 2;
    uint32 page = 3;
    bool has_next_page = 4;
  }
  message Tabard {
    uint32 cost = 1;
  }
  message Battlemaster {
    repeated string battlegrounds = 1;
  }

  string with = 1;
  oneof window {
    Merchant merchant = 10;
    Trainer trainer = 11;
    QuestDialog quest = 12;
    Gossip gossip = 13;
    FlightMap flight_map = 14;
    Bank bank = 15;
    MailInbox mail = 17;
    AuctionHouse auction_house = 18;
    Tradeskill tradeskill = 19;
    Inspect inspect = 20;
    ItemText item_text = 21;
    RaidBrowser raid_browser = 22;
    GuildBank guild_bank = 23;
    Socketing socketing = 24;
    Barber barber = 25;
    Stable stable = 26;
    Petition petition = 27;
    Registrar guild_registrar = 28;
    Tabard tabard = 29;
    Battlemaster battlemaster = 30;
  }
}

message MailInbox {
  repeated Interaction.Mail mails = 1;
}

message TradeLoot {
  message Trade {
    string with = 1;
    repeated Item mine = 2;
    repeated Item theirs = 3;
    uint32 my_money = 4;
    uint32 their_money = 5;
    bool they_accepted = 6;
    bool i_accepted = 7;
    // The "Will not be traded" slot (an item to enchant or unlock), each side.
    Item mine_not_traded = 8;
    Item theirs_not_traded = 9;
  }
  message Roll {
    Item item = 1;
    uint32 roll_id = 2;
    float time_left_s = 3;
    bool can_need = 4;
    bool can_disenchant = 5;
  }
  Trade trade = 1;
  repeated Item loot = 2;
  uint32 loot_money = 3;
  repeated Roll rolls = 4;
}

message Travel {
  message Transport {
    string to = 1;
    Place from = 2;
    float departs_in_s = 3;
  }
  repeated Place known_flight_paths = 1;
  Place nearest_flight_master = 2;
  Item mount = 3;
  repeated Transport transports = 4;
  // In flight: destination and time left.
  string flying_to = 5;
  float arrives_in_s = 6;
}

message PetFrame {
  message Totem {
    string name = 1;
    // "fire", "earth", "water", "air".
    string element = 2;
    float remaining_s = 3;
  }
  Unit pet = 1;
  repeated Totem totems = 2;
}

message Environment {
  message Falling {
    float height_yd = 1;
  }
  float breath_s = 1;
  float fatigue_s = 2;
  Falling falling = 3;
  // Feign Death / Fake Death mirror timers are not here; they are auras.
}

message Battleground {
  message Objective {
    string name = 1;
    string owner = 2;
  }
  string name = 1;
  map<string, int32> score = 2;
  repeated Objective objectives = 3;
  repeated string flag_carriers = 4;
  float remaining_s = 5;
  // World states (timers, counters) are in World.world_states only.
  reserved 6;
}

// In an arena match: the enemy team's frames (ArenaUI).
message Arena {
  string name = 1;
  // Preparation phase: gates open in.
  float starts_in_s = 2;
  string my_team = 3;
  string enemy_team = 4;
  uint32 my_team_rating = 5;
  uint32 enemy_team_rating = 6;
  // Enemy frames: class, health, power, casting, auras (trinket tracking is an addon,
  // e.g. Gladius, not modeled yet).
  repeated Unit enemies = 7;
}

// The battleground / arena score window.
message Scoreboard {
  message Row {
    string name = 1;
    string class = 2;
    // "horde" / "alliance" or the arena team.
    string team = 3;
    uint32 killing_blows = 4;
    uint32 honorable_kills = 5;
    uint32 deaths = 6;
    uint32 bonus_honor = 7;
    uint32 damage_done = 8;
    uint32 healing_done = 9;
    // Battleground-specific columns: "Flag Captures", "Bases Assaulted", ...
    map<string, uint32> objectives = 10;
    // Arena: rating change.
    int32 rating_change = 11;
  }
  repeated Row rows = 1;
}

message Surroundings {
  message Obstacle {
    enum Kind {
      KIND_UNSPECIFIED = 0;
      WALL = 1;
      SLOPE = 2;
      DROP = 3;
      WATER = 4;
      LEDGE = 5;
      OPENING = 6;
      DOOR = 7;
      TREE = 8;
      ROCK = 9;
    }
    Kind kind = 1;
    Relative rel = 2;
    float height_yd = 3;
  }
  repeated Direction walkable = 1;
  repeated Obstacle obstacles = 2;
  Relative goal = 3;
  // Optional synthetic top-down image (PNG, base64 in JSON).
  bytes image = 4;
  string description = 5;
}

// ---------------------------------------------------------------------------------
// Open panels (only while the bot has them open).

message Bags {
  message Hearthstone {
    bool ready = 1;
    string bind = 2;
  }
  repeated Item items = 1;
  uint32 free_slots = 2;
  uint32 total_slots = 3;
  Hearthstone hearthstone = 4;
  repeated Item keyring = 5;
}

message Map {
  message Zone {
    string name = 1;
    LevelRange level_range = 2;
  }
  message Questie {
    repeated Place quest_givers = 1;
    repeated Place spawn_areas = 2;
  }
  message InstanceMap {
    string floor = 1;
    repeated Place areas = 2;
  }
  Zone zone = 1;
  repeated Place places = 2;
  repeated Place bordering_zones = 3;
  repeated Place objective_locations = 4;
  Questie questie = 5 [(addon) = "Questie"];
  InstanceMap instance_map = 6;
}

message Character {
  message EquipmentSet {
    string name = 1;
    // Items in the set are all in bags or equipped.
    bool complete = 2;
  }
  repeated Item equipped = 1;
  uint32 gearscore = 2 [(addon) = "GearScore"];
  repeated StatValue stats = 3;
  repeated string titles = 4;
  string active_title = 5;
  repeated EquipmentSet equipment_sets = 6;
  // Currency tab (TokenUI): emblems, honor, arena points, badges.
  repeated CurrencyAmount currency = 7;
}

message Companions {
  repeated Spell mounts = 1;
  repeated Spell pets = 2;
}

message QuestLog {
  message Entry {
    Objective objective = 1;
    string description = 2;
    repeated Item rewards = 3;
    repeated Item choices = 4;
    uint32 money = 5;
    bool tracked = 6;
    bool shareable = 7;
  }
  repeated Entry quests = 1;
}

message Spellbook {
  repeated Spell spells = 1;
  repeated Spell pet_spells = 2;
}

message Talents {
  message Talent {
    string name = 1;
    uint32 rank = 2;
    uint32 max_rank = 3;
    string tree = 4;
    // Requirements met (tier, prerequisite).
    bool available = 5;
  }
  message Glyph {
    // "major" / "minor".
    string type = 1;
    // Empty when the socket is free; locked sockets show the unlock level.
    string name = 2;
    uint32 unlocks_at = 3;
  }
  message Spec {
    repeated uint32 points_per_tree = 1;
    bool active = 2;
  }
  uint32 unspent = 1;
  repeated string trees = 2;
  repeated uint32 points_per_tree = 3;
  repeated Talent talents = 4;
  repeated Glyph glyphs = 5;
  // Dual spec, when learned.
  repeated Spec specs = 6;
  // Hunter pet talents.
  repeated Talent pet_talents = 7;
  uint32 pet_unspent = 8;
}

message Skills {
  message Skill {
    string name = 1;
    uint32 skill = 2;
    uint32 max = 3;
    // "profession", "secondary", "weapon", "riding", "language", "armor".
    string category = 4;
  }
  repeated Skill skills = 1;
}

message Reputation {
  message Faction {
    string faction = 1;
    string standing = 2;
    int32 value = 3;
    int32 next = 4;
