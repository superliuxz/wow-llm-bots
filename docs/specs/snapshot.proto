    string name = 1;
    uint32 size = 2;
    uint32 rating = 3;
  }
  uint32 honor = 1;
  uint32 arena_points = 2;
  uint32 honorable_kills_today = 3;
  uint32 honorable_kills_total = 4;
  repeated ArenaTeam arena_teams = 5;
}

message Extensions {
  // Glance, always on screen.
