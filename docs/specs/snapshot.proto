    string class = 4;
    string zone = 5;
    string note = 6;
  }
  message Guild {
    string name = 1;
    string rank = 2;
    string motd = 3;
    uint32 online = 4;
    repeated Friend roster_online = 5;
  }
  message WhoResult {
    string query = 1;
    repeated Friend players = 2;
  }
  repeated Friend friends = 1;
  repeated string ignored = 2;
  Guild guild = 3;
  repeated string lfg_listings = 4;
  repeated string channels = 5;
  WhoResult who = 6;
}

message Calendar {
  message Entry {
    string title = 1;
    string when = 2;
    enum Status {
      STATUS_UNSPECIFIED = 0;
      INVITED = 1;
      ACCEPTED = 2;
      DECLINED = 3;
      TENTATIVE = 4;
    }
    Status my_status = 3;
    string creator = 4;
  }
  repeated Entry events = 1;
}

message Achievements {
  uint32 points = 1;
  repeated Achievement recent = 2;
  // The category the bot has open, with its achievements.
  string category = 3;
  repeated Achievement in_category = 4;
}

// The Dungeon Finder window (LFDFrame, "I" key). Raid Browser listings stay in
// `interaction.raid_browser` / `social.lfg_listings`.
message DungeonFinder {
  message Dungeon {
    string name = 1;
    LevelRange level_range = 2;
    // "heroic", "normal".
    string difficulty = 3;
    bool selected = 4;
    // Why it is greyed out: "level too low", "requires item level", "locked" ...
    string locked_reason = 5;
  }
  message Queue {
    float waited_s = 1;
    float average_wait_s = 2;
    // Still needed to fill the group (the eye tooltip / queue status).
    uint32 tanks_needed = 3;
    uint32 healers_needed = 4;
    uint32 dps_needed = 5;
  }
  // "random" or "specific".
  string mode = 1;
  // The random dungeon for my level, with its reward.
  string random_dungeon = 2;
  repeated Item random_rewards = 3;
  uint32 random_reward_money = 4;
  uint32 random_reward_xp = 5;
  // Bonus already earned today (smaller reward for further randoms).
  bool random_done_today = 6;
  repeated Dungeon dungeons = 7;
  repeated Role my_roles = 8;
  // Present while queued.
  Queue queue = 9;
  // The leader's "Find another player" / teleport options while in an LFG group.
  bool in_lfg_group = 10;
}

message Pvp {
