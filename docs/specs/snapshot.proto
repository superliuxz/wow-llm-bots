  Combat combat = 11;
  Party party = 12;
  Raid raid = 13;
  Encounter encounter = 14;
  Instance instance = 15;
  Death death = 16;
  Unit vehicle = 17;
  Interaction interaction = 18;
  TradeLoot trade_loot = 19;
  Travel travel = 20;
  PetFrame pet = 21;
  Environment environment = 22;
  Battleground battleground = 23;
  Surroundings surroundings = 24;
  // Possessing another unit (Eye of Acherus, a priest's Mind Control): its abilities
  // replace the action bar (in `possessed.vehicle.abilities` / `pet.abilities`), and
  // `base.nearby` is seen from it.
  Unit possessed = 25;
  Arena arena = 26;

  // Open panels.
  Bags bags = 40 [(visibility) = OPEN];
  Map map = 41 [(visibility) = OPEN];
  Character character = 42 [(visibility) = OPEN];
  QuestLog quest_log = 43 [(visibility) = OPEN];
  Spellbook spellbook = 44 [(visibility) = OPEN];
  Talents talents = 45 [(visibility) = OPEN];
  Skills skills = 46 [(visibility) = OPEN];
  Reputation reputation = 47 [(visibility) = OPEN];
  Social social = 48 [(visibility) = OPEN];
  Calendar calendar = 49 [(visibility) = OPEN];
  Achievements achievements = 50 [(visibility) = OPEN];
  Pvp pvp = 51 [(visibility) = OPEN];
  Companions companions = 52 [(visibility) = OPEN];
  DungeonFinder dungeon_finder = 53 [(visibility) = OPEN];
  Scoreboard scoreboard = 54 [(visibility) = OPEN];
}

// ---------------------------------------------------------------------------------
// Events (from packets to the bot's session).

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  SAY = 1;
  YELL = 2;
  WHISPER = 3;
  WHISPER_SENT = 4;
  PARTY = 5;
  RAID = 6;
  RAID_WARNING = 7;
  GUILD = 8;
  OFFICER = 9;
  GENERAL = 10;
  TRADE = 11;
  LFG = 12;
  EMOTE = 13;
  MONSTER_SAY = 14;
  MONSTER_YELL = 15;
  MONSTER_EMOTE = 16;
  MONSTER_WHISPER = 17;
  BOSS_EMOTE = 18;
  SYSTEM = 19;
  CUSTOM_CHANNEL = 20;
  BATTLEGROUND = 21;
  ACHIEVEMENT = 22;
}

// A link inside a chat message ([Item], |Hspell|, [Quest], [Achievement]).
message ChatLink {
  string text = 1;
  oneof object {
    Item item = 2;
    Spell spell = 3;
    QuestPart quest = 4;
    Achievement achievement = 5;
  }
}

message ChatEvent {
  ChatChannel channel = 1;
  // Custom channel name for CUSTOM_CHANNEL.
  string channel_name = 2;
  string from = 3;
  string text = 4;
  bool at_me = 5;
  float from_dist_yd = 6;
  repeated ChatLink links = 7;
}

message ErrorEvent {
  string text = 1;
}

// Yellow info text ("Quest accepted: ...", "You feel tipsy").
message InfoEvent {
  string text = 1;
}

// A popup that needs an answer (StaticPopup and friends).
message PromptEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    GROUP_INVITE = 1;
    TRADE = 2;
    DUEL = 3;
    GUILD_INVITE = 4;
    READY_CHECK = 5;
    ROLE_CHECK = 6;
    RESURRECT_OFFER = 7;
    SUMMON = 8;
    QUEST_SHARE = 9;
    BATTLEGROUND_READY = 10;
    ARENA_TEAM_INVITE = 11;
    WINTERGRASP_INVITE = 12;
    BIND_HEARTHSTONE = 13;
    CONFIRM_BIND_ON_PICKUP = 14;
    CONFIRM_DELETE_ITEM = 15;
    CONFIRM_ABANDON_QUEST = 16;
    CONFIRM_REPLACE_ENCHANT = 17;
    CONFIRM_TALENT_WIPE = 18;
    CONFIRM_RELEASE_SPIRIT = 19;
    CONFIRM_LOOT_ROLL = 20;
    CONFIRM_PETITION_SIGN = 21;
    CONFIRM_LEAVE_BATTLEGROUND = 22;
    CONFIRM_INSTANCE_LOCK = 23;
    CONFIRM_SPIRIT_HEALER = 24;
    CONFIRM_GUILD_LEADER = 25;
    CONFIRM_REPLACE_GEM = 26;
    // Dungeon Finder: "Your group has been found" (accept / decline, with a timer).
    LFG_PROPOSAL = 27;
    // Vote to kick a member of a Dungeon Finder group.
    LFG_BOOT_VOTE = 28;
    // A member left: "Find another player?" (continue queueing / leave).
    LFG_OFFER_CONTINUE = 29;
    // "Are you sure you want to purchase ... for 1000g?" (dual spec, bank slot, ...).
    CONFIRM_PURCHASE = 30;
  }
  Kind kind = 1;
  string from = 2;
  string text = 3;
  float timeout_s = 4;
  Item item = 5;
  uint32 cost = 6;
  // LFG_PROPOSAL: dungeon and the role I'd fill; LFG_BOOT_VOTE: who and why.
  string dungeon = 7;
  Role role = 8;
  string target = 9;
  string reason = 10;
}

message LevelUpEvent {
  uint32 level = 1;
  uint32 health_gain = 2;
  uint32 talent_points = 3;
  map<string, int32> stat_gains = 4;
}

message XpGainedEvent {
  uint32 amount = 1;
  string from = 2;
  uint32 rested_bonus = 3;
}

message MoneyChangedEvent {
  int32 delta = 1;
  string reason = 2;
}

message ItemReceivedEvent {
  Item item = 1;
  // "loot", "quest", "crafted", "bought", "mail", "trade".
  string how = 2;
}

message SkillUpEvent {
  string skill = 1;
  uint32 value = 2;
}

message QuestEvent {
  string quest = 1;
  uint32 xp = 2;
  uint32 money = 3;
}

message DiedEvent {
  string killer = 1;
  bool durability_loss = 2;
}

message ResurrectedEvent {
  string by = 1;
  bool resurrection_sickness = 2;
}

message LootRollEvent {
  Item item = 1;
  uint32 roll_id = 2;
}

message LootWonEvent {
  Item item = 1;
  string by = 2;
  // "need", "greed", "disenchant".
  string roll_type = 3;
  uint32 roll = 4;
}

// "Brakk has selected Greed for: [Item]" / "Greed Roll - 87 for [Item] by Brakk".
message LootRollChoiceEvent {
  uint32 roll_id = 1;
  Item item = 2;
  string who = 3;
  // "need", "greed", "disenchant", "pass".
  string choice = 4;
  // 0 until the rolls are revealed.
  uint32 roll = 5;
}

// /roll: "Will rolls 57 (1-100)".
message RollEvent {
  string who = 1;
  uint32 result = 2;
  uint32 min = 3;
  uint32 max = 4;
}

message MailEvent {
  string from = 1;
}

message AuctionEvent {
  Item item = 1;
  uint32 money = 2;
  // "sold", "expired", "outbid", "won".
  string outcome = 3;
}

message ZoneEvent {
  string zone = 1;
  string subzone = 2;
  uint32 xp = 3;
}

message InstanceEvent {
  string name = 1;
  string difficulty = 2;
  // "entered", "reset", "lockout_warning", "kicked_out".
  string what = 3;
}

message PathFailedEvent {
  Place to = 1;
}

message DuelEvent {
  string with = 1;
  string winner = 2;
  // "started", "ended", "fled".
  string what = 3;
}

message AchievementEvent {
  Achievement achievement = 1;
  // Someone else's ("[Guildie] has earned the achievement ...").
  string who = 2;
  bool server_first = 3;
}

message TitleEvent {
  string title = 1;
}

message KickedEvent {
  // "group", "guild", "battleground", "raid (not in raid group)".
  string from = 1;
  string by = 2;
  string reason = 3;
}

message HearthstoneBoundEvent {
  string place = 1;
}

message BattlegroundEvent {
  // "reported_afk", "flag_taken", "flag_dropped", "flag_captured", "base_assaulted",
  // "ended", ...
  string what = 1;
  string text = 2;
  // ended: winner and the honor / marks gained.
  string winner = 3;
  uint32 honor = 4;
  repeated Item rewards = 5;
}

message LfgEvent {
  // "joined_queue", "left_queue", "proposal_declined", "proposal_failed", "teleported_in",
  // "teleported_out", "dungeon_completed", "deserter", "kicked".
  string what = 1;
  string dungeon = 2;
  // dungeon_completed: the reward window.
  repeated Item rewards = 3;
  uint32 money = 4;
  uint32 xp = 5;
}

message DbmWarningEvent {
  string text = 1;
}

message CinematicEvent {
  bool started = 1;
}

message Event {
  oneof kind {
    ChatEvent chat = 1;
    ErrorEvent error = 2;
    InfoEvent info = 3;
    PromptEvent prompt = 4;
    LevelUpEvent level_up = 5;
    XpGainedEvent xp_gained = 6;
    MoneyChangedEvent money_changed = 7;
    ItemReceivedEvent item_received = 8;
    SkillUpEvent skill_up = 9;
    QuestEvent quest_complete = 10;
    QuestEvent quest_failed = 11;
    QuestEvent quest_accepted = 12;
    DiedEvent died = 13;
    ResurrectedEvent resurrected = 14;
    LootRollEvent loot_roll = 15;
    LootWonEvent loot_won = 16;
    RollEvent roll = 17;
    MailEvent mail_received = 18;
    AuctionEvent auction = 19;
    ZoneEvent zone_changed = 20;
    ZoneEvent discovered_area = 21;
    InstanceEvent instance = 22;
    PathFailedEvent path_failed = 23;
    DuelEvent duel = 24;
    AchievementEvent achievement_earned = 25;
    TitleEvent title_earned = 26;
    KickedEvent kicked = 27;
    HearthstoneBoundEvent hearthstone_bound = 28;
    BattlegroundEvent battleground = 29;
    DbmWarningEvent dbm_warning = 30 [(addon) = "DBM"];
    CinematicEvent cinematic = 31;
    TalentPointEvent talent_point_gained = 32;
    LootRollChoiceEvent loot_roll_choice = 33;
    LfgEvent lfg = 34;
  }
}

message TalentPointEvent {
  uint32 unspent = 1;
}

// ---------------------------------------------------------------------------------
// Messages on the bridge.

message Snapshot {
  string bot = 1;
  uint32 seq = 2;
  // Server time, ms since the Unix epoch (a string in JSON).
  int64 time_ms = 3;
  Base base = 4;
  Extensions ext = 5;
  // Events since the previous snapshot.
  repeated Event events = 6;
  // Numbered options (1-based); the brain answers with a number, plus one fill-in per blank.
  repeated Option options = 7;
}

// One thing the bot can do now, phrased as a player intent.
message Option {
  // "___" marks each blank, in the order of `blanks`, e.g.
  // "Buy a guild charter named ___".
  string text = 1;
  repeated Blank blanks = 2;
}

// Something the player would type into the client (a name, a price, an amount). The
// module checks the fill-in with the client's own rules; if it is invalid the action is
// not taken and the bot gets the client's `error` event ("That name is invalid").
message Blank {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Free text: mail subject / body, charter or guild MOTD, auction search.
    TEXT = 1;
    // A new name under the client's naming rules: guild, charter, pet, arena team.
    NEW_NAME = 2;
    // An existing player's name: mail recipient, charter offer, /who, invite.
    PLAYER = 3;
    // Copper (the brain writes "12g 50s" or "1250"; the harness converts).
    MONEY = 4;
    // A count: stack split, items to buy / withdraw.
    COUNT = 5;
  }
  Kind kind = 1;
  // What the client's box is labelled, e.g. "Buyout price", "To".
  string label = 2;
  uint32 max_length = 3;
  // MONEY / COUNT bounds (e.g. buyout <= my money for bids, count <= stack size).
  uint32 min = 4;
  uint32 max = 5;
}

// Module -> harness.
message ModuleMessage {
  oneof message {
    Snapshot snapshot = 1;
    // Sent immediately, between snapshots, for events that wake the brain
    // (whisper, prompt, died).
    ImmediateEvent event = 2;
  }
}

message ImmediateEvent {
  string bot = 1;
  uint32 seq = 2;
  int64 time_ms = 3;
  Event event = 4;
}

// Harness -> module.
message Command {
  message Choose {
    // 1-based index into Snapshot.options of snapshot `seq`.
    uint32 option = 1;
    uint32 seq = 2;
    // One per blank of the chosen option, in order.
    repeated string fills = 3;
  }
  message SetGoal {
    GoalPart.Kind goal_kind = 1;
    map<string, string> params = 2;
  }
  message ClearGoal {
    string id = 1;
  }
  message Say {
    ChatChannel channel = 1;
    string text = 2;
    // Whisper target / custom channel name.
    string to = 3;
  }
  message Open {
    Panel panel = 1;
  }
  message Close {
    Panel panel = 1;
  }
  message Hover {
    HoverRef ref = 1;
  }
  message AhSearch {
    string query = 1;
  }
  message Who {
    string query = 1;
  }

  string bot = 1;
  oneof command {
    Choose choose = 10;
    SetGoal set_goal = 11;
    ClearGoal clear_goal = 12;
    Say say = 13;
    Open open = 14;
    Close close = 15;
    Hover hover = 16;
    AhSearch ah_search = 17;
    Who who = 18;
  }
}
