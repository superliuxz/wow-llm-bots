//
// Field annotations for snapshot.proto (visibility level, addon). Kept in their own file
// because custom options extend descriptor.proto, which protobuf only allows from a
// non-lite file; snapshot.proto itself is LITE_RUNTIME. The module never reads these
// options; tooling (validator, harness) reads them through descriptors.

syntax = "proto3";

package wlb.snapshot;

import "google/protobuf/descriptor.proto";


enum Visibility {
  // Inherits from the enclosing message (top level: GLANCE).
  VISIBILITY_UNSPECIFIED = 0;
  // On screen without doing anything.
  GLANCE = 1;
  // Only while the bot has the panel open (`open` command or auto-open).
  OPEN = 2;
  // Only in a tooltip, after a `hover` command.
  HOVER = 3;
}

extend google.protobuf.FieldOptions {
  Visibility visibility = 50000;
  // Name of the addon that provides this field (e.g. "DBM", "Questie", "Omen").
  string addon = 50001;
}
